<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada - Argos</title>

    <!-- Fontes do Figma  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/error.css">

    <!-- JAVASCRIPT -->
    <script src="assets/js/404.js"></script>
</head>
<body class="pagina-erro">

    <header class="erro-topo">
        <a href="home.html">
            <img src="assets/img/logo-argos.png" alt="Argos">
        </a>
    </header>

    <main class="erro-conteudo">

        <section class="erro-bloco">
            <hr class="tap-linha">

            <div class="erro-palco">
                <div class="tap-area" aria-live="polite">
                    <button type="button" class="tap-botao" id="tap">Clique para continuar</button>
                </div>

                <div class="erro-revelar">
                    <p class="erro-codigo passo passo-1" aria-hidden="true">404</p>
                    <h1 class="erro-titulo passo passo-2" id="titulo" tabindex="-1">Página não encontrada</h1>
                    <p class="erro-texto passo passo-3">O endereço que você tentou abrir não existe ou foi movido. Confira o link ou volte para o início.</p>
                    <a class="erro-botao passo passo-4" href="home.html">Voltar ao início</a>
                </div>
            </div>
        </section>

        <img class="erro-mascote" src="assets/img/mascote-boas-vindas.png" alt="">

    </main>

    <svg class="erro-ondas" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
        <path style="fill:#62BB4D;fill-opacity:0.18" d="M0 70C220 20 430 30 650 80C880 135 1100 130 1440 40V200H0Z"/>
        <path style="fill:#62BB4D;fill-opacity:0.18" d="M0 110C260 60 520 80 760 125C1010 170 1220 150 1440 90V200H0Z"/>
        <path style="fill:#62BB4D;fill-opacity:0.25" d="M0 150C280 115 560 140 820 165C1060 188 1260 178 1440 150V200H0Z"/>
    </svg>

</body>
</html>
