<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGOS | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logos/LogoTipo.svg">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<main class="login">
    <a href="#inicio" class="botao-voltar" id="btn-voltar">
        ← Voltar
    </a>
    <div class="onda-verde-login">
        <svg preserveAspectRatio="none" viewBox="0 0 632 884" fill="none">
            <path d="M590.225 891H-0.00012207L-0.00012207 -46.9999C230.497 -46.9999 590.225 -46.9999 590.225 -46.9999C387.502 382 748.5 434 590.225 891Z" fill="url(#paint0_linear_3693_762)"/>
            <defs>
                <linearGradient id="paint0_linear_3693_762" x1="31.5087" y1="380.538" x2="657.748" y2="380.538" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#022C1E"/>
                    <stop offset="1" stop-color="#06412F"/>
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div class="logo-login">
        <a class="marca" href="landingV2.html#inicio"><img src="logos/Logo Deitada clara.svg" alt="Argos"></a>
    </div>

    <!-- PERSONAGEM (boi) -->
    <div class="personagem-login">
        <img src="imagens/mascote-login.svg" alt="Mascote do ARGOS">
    </div>

    <!-- FORMULÁRIO (lado direito) -->
    <section class="area-form">

        <form class="form-login" id="form-login" novalidate>

            <h1 class="form-titulo">Olá Admin!</h1>
            <p class="form-subtitulo">Preencha seus dados para continuar</p>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="campo-caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 7.2L4.5 7v.1L12 12.4 19.5 7.1V7L12 12.2Z" fill="currentColor"/></svg>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Z" fill="currentColor"/></svg>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                    <button type="button" class="botao-olho" id="btn-olho" aria-label="Mostrar senha">
                        <svg id="olho-aberto" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"/></svg>
                        <svg id="olho-fechado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 4.7 4.7 3.3l16 16-1.4 1.4-3.1-3.1A10.5 10.5 0 0 1 12 19C7 19 3 14.5 2 12c.6-1.4 2-3.2 3.9-4.600L3.3 4.7ZM12 5c5 0 9 4.5 10 7-.4 1-1.2 2.2-2.400 3.3L16.700 12.400A4.800 4.800 0 0 0 12 7.2c-.4 0-.8.1-1.2.2L8.600 5.2C9.700 5 10.800 5 12 5Z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>

            <p class="msg-erro" id="msg-erro" role="alert" aria-live="polite"></p>
            <br>
            <button type="submit" class="botao-entrar" id="btn-entrar">Entrar</button>

        </form>

    </section>

</main>

<script src="login.js"></script>
</body>
</html>
